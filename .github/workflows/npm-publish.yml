# Publishes founder-suite to npm when a GitHub release is created.
# Requires an NPM_TOKEN repository secret (npm automation/granular token with publish rights).

name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Check skills are in sync with shared/
        run: node scripts/sync-shared.js --check
      - name: Check release tag matches package version
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")" ] \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
